<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Now Bar</title>
    <link rel="stylesheet" href="glass.css" />
  </head>
  <body>
    <div id="shell" data-variant="expanded">
      <div id="scene" class="scene" aria-hidden="true"></div>
      <div class="scene-dim"></div>

      <div id="card" class="card">
        <img id="art" alt="" width="44" height="44" />
        <div class="meta">
          <p id="title"></p>
          <p id="artist"></p>
        </div>
      </div>

      <div id="controls" class="controls">
        <button id="prev" class="icon-button" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
        </button>
        <button id="play" class="icon-button play" type="button" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next" class="icon-button" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg>
        </button>
        <button id="scene-skip" class="icon-button" type="button" aria-label="Next scene">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/></svg>
        </button>
        <button id="collapse" class="icon-button" type="button" aria-label="Collapse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v2H6z"/></svg>
        </button>
        <button id="close" class="icon-button" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>

      <button id="expand" class="expand" type="button" aria-label="Expand">
        <img id="art-mini" alt="" width="40" height="40" />
      </button>
    </div>
    <script src="owner.js"></script>
  </body>
</html>
